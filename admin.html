<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Module | StayEasy</title>
    <link rel="stylesheet" href="style.css?v=20261106-verified-galleries" />
  </head>

  <body>
    <nav class="dashboard-nav">
      <a class="brand" href="admin.html">Stay<span>Easy</span></a>

      <div>
        <span class="admin-badge">ADMIN MODULE</span>
        <button class="logout" onclick="logout()">Logout</button>
      </div>
    </nav>

    <main class="dashboard">
      <div class="dash-head">
        <div>
          <p class="eyebrow blue">ADMIN MODULE</p>
          <h1>Manage StayEasy</h1>
          <p class="muted">Manage hotel inventory and booking activity.</p>
        </div>
      </div>

      <section class="stats">
        <div>
          <b id="hotelCount">0</b>
          <small>Hotels</small>
        </div>
        <div>
          <b id="roomCount">0</b>
          <small>Rooms</small>
        </div>
        <div>
          <b id="adminBookingCount">0</b>
          <small>Bookings</small>
        </div>
        <div>
          <b id="userCount">0</b>
          <small>Users</small>
        </div>
      </section>

      <section class="admin-grid">
        <div class="card">
          <h2>Add Hotel</h2>

          <form id="hotelForm">
            <label>
              Hotel Name
              <input id="hotelName" required />
            </label>

            <label>
              Location
              <input id="hotelLocation" required />
            </label>

            <label>
              Price / Night
              <input id="hotelPrice" type="number" min="1" required />
            </label>

            <label>
              Rooms
              <input id="hotelRooms" type="number" min="0" required />
            </label>

            <label>
              Amenities
              <input id="hotelAmenities" placeholder="WiFi, Pool, Breakfast" required />
            </label>

            <button class="primary-btn full" type="submit">Add Hotel</button>
          </form>
        </div>

        <div class="card">
          <div class="section-head">
            <h2>Hotel Inventory</h2>
            <span id="inventoryCount"></span>
          </div>

          <div id="adminHotels"></div>
        </div>
      </section>

      <div class="card">
        <div class="section-head">
          <h2>Booking Activity</h2>
          <span>Local Storage</span>
        </div>

        <div id="adminBookings"></div>
      </div>
    </main>

    <script src="script.js?v=20261106-verified-galleries"></script>
  </body>
</html>
