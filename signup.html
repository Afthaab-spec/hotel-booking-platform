<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup | StayEasy</title>
    <link rel="stylesheet" href="style.css?v=20261106-verified-galleries" />
  </head>

  <body class="auth">
    <div class="auth-card">
      <a class="brand dark" href="index.html">Stay<span>Easy</span></a>

      <p class="eyebrow blue">NEW USER</p>
      <h1>Create Account</h1>
      <p class="muted">Account details are stored in Local Storage for this demo.</p>

      <form id="signupForm">
        <label>
          Full Name
          <input id="signupName" required placeholder="Full name" />
        </label>

        <label>
          Email
          <input id="signupEmail" type="email" required placeholder="Email" />
        </label>

        <label>
          Password
          <input id="signupPassword" type="password" minlength="6" required placeholder="Minimum 6 characters" />
        </label>

        <label>
          Confirm Password
          <input id="signupConfirm" type="password" minlength="6" required placeholder="Re-enter password" />
        </label>

        <button class="primary-btn full" type="submit">Create Account</button>
      </form>

      <p id="signupMessage" class="message"></p>

      <p class="auth-footer">
        Already registered? <a href="login.html">Login</a>
      </p>
    </div>

    <script src="script.js?v=20261106-verified-galleries"></script>
  </body>
</html>
