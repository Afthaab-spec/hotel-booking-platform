<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | StayEasy</title>
    <link rel="stylesheet" href="style.css?v=20261106-verified-galleries" />
  </head>

  <body class="auth">
    <div class="auth-card">
      <a class="brand dark" href="index.html">Stay<span>Easy</span></a>

      <p class="eyebrow blue">WELCOME BACK</p>
      <h1>Login</h1>
      <p class="muted">Login redirects you to the correct module.</p>

      <form id="loginForm">
        <label>
          Email
          <input id="loginEmail" type="email" required placeholder="Enter email" />
        </label>

        <label>
          Password
          <input id="loginPassword" type="password" required placeholder="Enter password" />
        </label>

        <button class="primary-btn full" type="submit">Login</button>
      </form>

      <p id="loginMessage" class="message"></p>

      <p class="auth-footer">
        New user? <a href="signup.html">Create account</a>
      </p>
    </div>

    <script src="script.js?v=20261106-verified-galleries"></script>
  </body>
</html>
